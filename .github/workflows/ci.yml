name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vet, fmt, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l go proto)" || { gofmt -l go proto; exit 1; }
      - run: go vet ./go/...
      - run: go vet -tags integration ./go/test/integration/
      - run: go test -race -count=1 ./go/...

  ml-pipeline:
    name: ML pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/projects/loan_default/requirements.txt
      - run: pip install -r ml/projects/loan_default/requirements.txt pytest
      - run: pytest -q ml/projects/loan_default/tests

  ml-service:
    name: ml-service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements-dev.txt
      - run: pip install -r ml-service/requirements-dev.txt
      - run: pytest -q
        working-directory: ml-service

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  integration:
    name: Full stack (compose + integration + e2e)
    runs-on: ubuntu-latest
    needs: [go, ml-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start stack
        run: docker compose up -d --build postgres minio ml-service server
      - name: Wait for the control plane
        run: |
          for i in $(seq 1 60); do
            curl -sf localhost:8080/healthz && exit 0
            sleep 2
          done
          docker compose logs; exit 1
      - name: Go integration test (real Postgres, MinIO, ml-service)
        run: go test -tags integration -count=1 -v ./go/test/integration/
      - name: Seed registry
        run: bash scripts/seed_registry.sh
        env:
          PYTHON: python3
      - name: End-to-end smoke test
        run: bash scripts/e2e_smoke.sh
        env:
          PYTHON: python3
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
