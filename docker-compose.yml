name: driftline

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-driftline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-driftline}
      POSTGRES_DB: ${POSTGRES_DB:-driftline}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # minio/minio is no longer published on Docker Hub; Chainguard ships a free
    # build with only a "latest" tag, so pin the exact image by digest.
    image: chainguard/minio@sha256:f74600a1a46330cdbda1ef760d17a96bd6e0f4a6f0a2c49792ca3ee7e4c6fa18
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]   # 9001 = web console
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-service:
    build: ./ml-service
    environment:
      MODEL_DIR: /app/models
      GRPC_PORT: "50051"
      HTTP_PORT: "8000"
      # Models not baked into the image are pulled from the registry bucket.
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-driftline-artifacts}
    ports: ["50051:50051", "8000:8000"]
    depends_on:
      minio: {condition: service_healthy}

  server:
    build:
      context: .
      dockerfile: go/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-driftline}:${POSTGRES_PASSWORD:-driftline}@postgres:5432/${POSTGRES_DB:-driftline}?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-driftline-artifacts}
      ML_SERVICE_ADDR: ml-service:50051
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      ALERT_COOLDOWN: ${ALERT_COOLDOWN:-30m}
      API_KEY: ${API_KEY:-}
      DRIFT_INTERVAL: ${DRIFT_INTERVAL:-1m}
      DRIFT_WINDOW: ${DRIFT_WINDOW:-15m}
      DRIFT_MIN_SAMPLES: ${DRIFT_MIN_SAMPLES:-100}
      AUTO_ROLLBACK: ${AUTO_ROLLBACK:-true}
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
      ml-service: {condition: service_healthy}

  frontend:
    build: ./frontend
    environment:
      GO_API_URL: http://server:8080
      ML_SERVICE_URL: http://ml-service:8000
      # Server-side only: the dashboard's /go/* proxy attaches it, the browser never sees it.
      DRIFTLINE_API_KEY: ${API_KEY:-}
    ports: ["3000:3000"]
    depends_on: [server, ml-service]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports: ["9090:9090"]
    depends_on: [server, ml-service]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # read-only viewing without login, local use
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/driftline.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
  miniodata:
  promdata:
  grafanadata:
